include ':app'

// Capacitor core + plugins are added automatically here by `npx cap sync android`.
// After running cap sync, this file will also include lines like:
// include ':capacitor-android'
// project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
// apply from: 'capacitor.settings.gradle'

// If capacitor.settings.gradle exists (generated by `npx cap sync`), apply it.
def capSettings = new File(rootProject.projectDir, 'capacitor.settings.gradle')
if (capSettings.exists()) {
    apply from: capSettings
}
